# Seed target list. Start with 150 to 300 companies matching the ByoSync ICP:
# Indian AI native SaaS or tech MSME, 4 to 100 people, live product, sensitive
# data, two or more integrations, no security team.
#
# Where to source the seed list for free: YC India batches, Product Hunt India,
# Inc42 and YourStory funding coverage, NASSCOM DeepTech listings, SaaSBoomi
# member pages, AWS and Google for Startups India cohorts, and the companies
# already in the Apollo organisation lookup (that endpoint works on the
# current plan even though people search does not).

